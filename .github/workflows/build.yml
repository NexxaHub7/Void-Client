name: Build VoidX Client

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract VoidX project
        shell: bash
        run: |
          rm -rf VoidXBuild
          mkdir VoidXBuild
          unzip -q VoidXClient-1.21.zip -d VoidXBuild

          echo "=== PROJECT ==="
          find VoidXBuild -maxdepth 4 -type f | sort

      - name: Find Gradle project
        id: gradle_project
        shell: bash
        run: |
          PROJECT_DIR=$(find VoidXBuild -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find VoidXBuild -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ No se encontró un proyecto Gradle."
            exit 1
          fi

          echo "Proyecto: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build VoidX
        working-directory: ${{ steps.gradle_project.outputs.project_dir }}
        run: |
          gradle --version
          gradle build --no-daemon --stacktrace

      - name: Upload VoidX JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidX-Client
          path: "VoidXBuild/**/build/libs/*.jar"
          if-no-files-found: error
