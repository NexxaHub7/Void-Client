name: Build VoidX Client

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract VoidX project
        shell: bash
        run: |
          echo "📦 Extrayendo VoidXClient-1.21.zip..."

          mkdir -p VoidXBuild
          unzip -q VoidXClient-1.21.zip -d VoidXBuild

          echo "📁 Contenido extraído:"
          find VoidXBuild -maxdepth 3 -type f | sort

      - name: Find Gradle project
        id: gradle_project
        shell: bash
        run: |
          PROJECT_DIR=$(find VoidXBuild -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find VoidXBuild -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ No se encontró build.gradle/settings.gradle dentro del ZIP."
            find VoidXBuild -type f | sort
            exit 1
          fi

          echo "✅ Proyecto encontrado:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build VoidX
        working-directory: ${{ steps.gradle_project.outputs.project_dir }}
        run: |
          gradle build --no-daemon

      - name: Upload VoidX JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidX-Client
          path: "VoidXBuild/**/build/libs/*.jar"
          if-no-files-found: error
