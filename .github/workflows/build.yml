name: Build VoidX Client

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project
        id: find_project
        shell: bash
        run: |
          echo "Buscando proyecto Gradle..."

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ No se encontró ningún proyecto Gradle."
            echo "Archivos encontrados:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "✅ Proyecto encontrado en: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project files
        run: |
          echo "📁 Proyecto:"
          ls -la "${{ steps.find_project.outputs.project_dir }}"

      - name: Build VoidX
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: voidx-client
          path: "**/build/libs/*.jar"
          if-no-files-found: error
